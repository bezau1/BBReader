<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Blast Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Block Blast Calculator</h1>
  <p class="sub">Tap cells to match your board, pick your 3 pieces, and get the best moves.</p>

  <section class="card">
    <h2>1. Your board <button id="clear" class="link">Clear</button></h2>
    <div id="board" class="board" aria-label="Board"></div>
  </section>

  <section class="card">
    <h2>2. Your 3 pieces</h2>
    <div id="slots" class="slots"></div>
    <p class="hint">Select a slot, then choose a shape below.</p>
    <div id="palette" class="palette"></div>
  </section>

  <button id="solve" class="primary">Calculate best moves</button>

  <section class="card" id="result" hidden>
    <h2>Result</h2>
    <div id="summary"></div>
    <div id="steps" class="steps"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
